name = "pato-placar"
main = "src/index.js"
compatibility_date = "2026-11-01"

# O jogo (pato.leorods.org) é outro worker, só de arquivos estáticos (ci/wrangler.jsonc); o placar tem um subdomínio próprio.
# O `wrangler deploy` cria sozinho o registro DNS (tipo Worker) e o certificado: não crie esse registro à mão.
routes = [{ pattern = "placar.leorods.org", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "pato-placar"
database_id = "3f5ee2b5-d4a8-4f4e-a081-157eeb7a5125"

[vars]
# origens que podem chamar o placar, separadas por vírgula (para testar o export local, acrescente http://localhost:8765)
ORIGENS = "https://pato.leorods.org"
# o segredo dos tokens NÃO fica aqui: npx wrangler secret put PLACAR_SEGREDO
